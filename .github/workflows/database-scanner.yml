name: Ash Horizon Database Scanner

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/database-scanner.yml"
      - "PBS/**"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/database-scanner.yml"
      - "PBS/**"
  workflow_dispatch:
    inputs:
      database_path:
        description: "Optional repository-relative database folder"
        required: false
        default: "."

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run scanner tests
        run: python -m unittest discover -s tests -v
      - name: Scan repository database
        run: |
          python tools/ash_horizon_scanner.py --root "${{ github.event.inputs.database_path || '.' }}" --json scanner-report.json
      - name: Upload scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ash-horizon-database-report
          path: scanner-report.json
          if-no-files-found: ignore
