name: Pokemon Ash Horizon - Windows 32-bit Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 32-bit Windows game
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up 32-bit MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            unzip

      - name: Download SDL3 3.4.20 for Windows x86
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "SDL3-x86.zip"
          $destination = Join-Path $env:GITHUB_WORKSPACE "SDL3"
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-3.4.20-win32-x86.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force

      - name: Build game
        run: |
          set -euxo pipefail

          echo "Locating SDL3 development files..."
          SDL_HEADER="$(find SDL3 -type f -path '*/include/SDL3/SDL.h' -print -quit)"
          SDL_IMPORT_LIB="$(find SDL3 -type f -name 'libSDL3.dll.a' -print -quit)"
          SDL_DLL="$(find SDL3 -type f -name 'SDL3.dll' -print -quit)"

          if [ -z "$SDL_HEADER" ] || [ -z "$SDL_IMPORT_LIB" ] || [ -z "$SDL_DLL" ]; then
            echo "ERROR: SDL3 header, import library, or DLL was not found."
            find SDL3 -maxdepth 5 -type f -print
            exit 1
          fi

          SDL_INCLUDE_DIR="$(dirname "$(dirname "$SDL_HEADER")")"
          SDL_LIB_DIR="$(dirname "$SDL_IMPORT_LIB")"

          echo "SDL include: $SDL_INCLUDE_DIR"
          echo "SDL library: $SDL_IMPORT_LIB"
          echo "SDL runtime: $SDL_DLL"

          g++ --version
          g++ -std=c++17 -O2 -Wall -Wextra -static-libgcc -static-libstdc++ src/main.cpp -o PokemonAshHorizon.exe -I"$SDL_INCLUDE_DIR" -L"$SDL_LIB_DIR" -lSDL3

          cp "$SDL_DLL" ./SDL3.dll

      - name: Verify executable is 32-bit
        run: |
          set -euxo pipefail
          objdump -f PokemonAshHorizon.exe
          objdump -f PokemonAshHorizon.exe | grep -q "pei-i386"
          file PokemonAshHorizon.exe

      - name: Upload Windows x86 build
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Ash-Horizon-Windows-x86
          path: |
            PokemonAshHorizon.exe
            SDL3.dll
          if-no-files-found: error
