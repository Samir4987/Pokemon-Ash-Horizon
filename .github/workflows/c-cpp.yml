name: Pokemon Ash Horizon - Windows 32-bit Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 32-bit Windows game
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up 32-bit MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            unzip

      - name: Run friendship refusal rule unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/friendship_rules_test.cpp -o friendship_rules_test.exe
          ./friendship_rules_test.exe

      - name: Run battle stat unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/battle_stats_test.cpp -o battle_stats_test.exe
          ./battle_stats_test.exe

      - name: Run complete type-chart unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/type_chart_test.cpp -o type_chart_test.exe
          ./type_chart_test.exe

      - name: Run Pokédex data unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/pokemon_data_test.cpp -o pokemon_data_test.exe
          ./pokemon_data_test.exe

      - name: Run Pokémon party unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/pokemon_party_test.cpp -o pokemon_party_test.exe
          ./pokemon_party_test.exe

      - name: Run battle format unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/battle_format_test.cpp -o battle_format_test.exe
          ./battle_format_test.exe

      - name: Run save and inventory unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/save_game_test.cpp -o save_game_test.exe
          ./save_game_test.exe

      - name: Run gameplay system unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra tests/gameplay_system_test.cpp -o gameplay_system_test.exe
          ./gameplay_system_test.exe

      - name: Download SDL3 3.4.20 MinGW development package (x86)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "SDL3-devel-mingw.zip"
          $destination = Join-Path $env:GITHUB_WORKSPACE "SDL3"
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-3.4.20/SDL3-devel-3.4.20-mingw.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination -Force

      - name: Download SDL3_image 3.4.8 MinGW development package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "SDL3_image-devel-mingw.tar.gz"
          $destination = Join-Path $env:GITHUB_WORKSPACE "SDL3_image"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.8/SDL3_image-devel-3.4.8-mingw.tar.gz" -OutFile $archive
          tar -xzf $archive -C $destination

      - name: Build game
        run: |
          set -euxo pipefail

          SDL_HEADER="$(find SDL3 -type f -path '*/include/SDL3/SDL.h' -print -quit)"
          SDL_IMPORT_LIB="$(find SDL3 -type f -name 'libSDL3.dll.a' -print -quit)"
          SDL_DLL="$(find SDL3 -type f -name 'SDL3.dll' -print -quit)"
          IMG_HEADER="$(find SDL3_image -type f -path '*/include/SDL3_image/SDL_image.h' -print -quit)"
          IMG_IMPORT_LIB="$(find SDL3_image -type f -name 'libSDL3_image.dll.a' -print -quit)"
          IMG_DLL="$(find SDL3_image -type f -name 'SDL3_image.dll' -print -quit)"

          if [ -z "$SDL_HEADER" ] || [ -z "$SDL_IMPORT_LIB" ] || [ -z "$SDL_DLL" ] || [ -z "$IMG_HEADER" ] || [ -z "$IMG_IMPORT_LIB" ] || [ -z "$IMG_DLL" ]; then
            echo "ERROR: SDL3 or SDL3_image x86 development/runtime files were not found."
            find SDL3 SDL3_image -maxdepth 8 -type f -print
            exit 1
          fi

          SDL_INCLUDE_DIR="$(dirname "$(dirname "$SDL_HEADER")")"
          SDL_LIB_DIR="$(dirname "$SDL_IMPORT_LIB")"
          IMG_INCLUDE_DIR="$(dirname "$(dirname "$IMG_HEADER")")"
          IMG_LIB_DIR="$(dirname "$IMG_IMPORT_LIB")"

          g++ --version
          g++ -std=c++17 -O2 -Wall -Wextra -DASH_HORIZON_PRIVATE_BUILD -static-libgcc -static-libstdc++ src/main.cpp -o PokemonAshHorizon.exe -I"$SDL_INCLUDE_DIR" -I"$IMG_INCLUDE_DIR" -L"$SDL_LIB_DIR" -L"$IMG_LIB_DIR" -lSDL3_image -lSDL3

          cp "$SDL_DLL" ./SDL3.dll
          cp "$IMG_DLL" ./SDL3_image.dll

      - name: Verify executable is 32-bit
        run: |
          set -euxo pipefail
          objdump -f PokemonAshHorizon.exe
          objdump -f PokemonAshHorizon.exe | grep -q "pei-i386"
          file PokemonAshHorizon.exe

      - name: Upload Windows x86 build
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Ash-Horizon-Windows-x86
          path: |
            PokemonAshHorizon.exe
            SDL3.dll
            SDL3_image.dll
          if-no-files-found: error
